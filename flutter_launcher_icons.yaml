# App icon generation (Group A). Masters are produced from the brand SVGs by
# tool/branding/generate_icons.mjs into branding/out/. Regenerate icons with:
#   dart run flutter_launcher_icons
#
# Brand: gold symbol (#E4C094) on wine (#431C33). iOS icon is flattened opaque
# (no alpha — App Store requirement).
#
# ⚠️  ANDROID ADAPTIVE LAYERS ARE NO LONGER GENERATED FROM THIS CONFIG.
#
# `android/app/src/main/res/mipmap-*/ic_launcher_foreground.png` and
# `mipmap-anydpi-v26/ic_launcher.xml` are hand-maintained from the vetted set in
# `branding/android/` (see branding/INSTALL.md). Running this tool WILL revert
# them: it rewrites ic_launcher.xml without the 12% inset and recreates the
# `drawable-*/ic_launcher_{foreground,monochrome}.png` files that were
# deliberately deleted.
#
# Why the inset exists: the foreground master carries the symbol at ~61% of the
# 108dp frame, filling the 66dp safe zone edge to edge. The safe zone is the
# maximum unclipped region, NOT a sizing target — unwrapped, the symbol renders
# at ~91% of the 72dp visible area against iOS's 70%. The 12% inset lands it at
# ~50dp (69%), matching iOS.
#
# If you regenerate: re-copy the five foregrounds from branding/android/,
# restore the inset in ic_launcher.xml, and re-delete the drawable-* orphans.
# The iOS side below is still generated normally and is safe to re-run.
flutter_launcher_icons:
  image_path: "branding/out/ic_ios_1024.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#431C33"
  adaptive_icon_foreground: "branding/out/ic_adaptive_fg.png"
  adaptive_icon_monochrome: "branding/out/ic_monochrome.png"
