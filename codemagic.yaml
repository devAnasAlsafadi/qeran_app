# Codemagic CI — iOS release build to TestFlight.
#
# Scope: builds a signed IPA and hands it to TestFlight for internal testers.
# It deliberately does NOT submit to App Store review — `submit_to_app_store`
# is absent, and adding it is a separate decision.
#
# The three account-specific values here — the App Store Connect API key
# NAME, the numeric app id, and the tester group — are confirmed values,
# not guesses. None of them is a secret: the .p8 private key and the
# Issuer/Key IDs live in Codemagic’s own integration store and must never
# be committed to this repository.
#
# Triggering is manual on purpose (no `triggering:` block) — the first build
# should be started from the Codemagic UI and watched.

workflows:
  ios-testflight:
    name: iOS release → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Codemagic → Teams → Integrations → Developer Portal → the NAME given
      # to the App Store Connect API key there. Anas uploads the .p8 himself;
      # only the name is referenced here.
      app_store_connect: Codemagic

    environment:
      flutter: 3.44.8 # matches the local toolchain this was verified against
      xcode: latest
      cocoapods: default

      vars:
        # Apple ID of the app in App Store Connect — the numeric id from the
        # app's URL, NOT the bundle id and NOT an email address. Used only to
        # read back the latest TestFlight build number.
        APP_STORE_APPLE_ID: "6783272039"
        BUNDLE_ID: "com.qeran.app"

    scripts:
      - name: Flutter packages
        script: flutter pub get

      - name: CocoaPods
        # sign_in_with_apple is a real pod (ios/Podfile.lock); the rest of the
        # plugins come through Swift Package Manager, which needs no step.
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          keychain initialize
          openssl genrsa -out /tmp/certificate_private_key 2048
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/certificate_private_key)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/certificate_private_key
          keychain add-certificates

      - name: Apply fetched provisioning profiles
        # Configures Xcode project to use the fetched profiles and writes
        # /Users/builder/export_options.plist for the build.
        script: xcode-project use-profiles

      - name: Build signed IPA
        # Apple rejects a build whose number is not greater than the last one
        # uploaded, and pubspec is at +11 locally. Reading the latest from
        # TestFlight and adding one keeps that true without editing pubspec.
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Confirm GoogleService-Info.plist reached the bundle
        # THE pass condition for the Runner-target registration. A green build
        # proves nothing here: the broken state — plist in the folder, absent
        # from the target — compiled and shipped green, and that is exactly
        # what broke iOS Google Sign-In. Fail loudly instead of shipping it.
        script: |
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)
          if unzip -l "$IPA" | grep -q "GoogleService-Info.plist"; then
            echo "OK — GoogleService-Info.plist is present in $IPA"
          else
            echo "MISSING — GoogleService-Info.plist was NOT found inside $IPA"
            unzip -l "$IPA" | grep "Payload" || true
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No `beta_groups` here, deliberately — do not re-add "Internal".
        #
        # `beta_groups` maps to the App Store Connect build→betaGroups
        # assignment, which accepts EXTERNAL groups only. Internal groups
        # already receive every processed build automatically, so there is
        # nothing to assign; asking for it fails with "Builds cannot be
        # assigned to this internal group." That failure lands AFTER the
        # upload has succeeded, so it reds a build that actually shipped.
        #
        # With submit_to_testflight and no beta_groups, the build reaches
        # internal testers without Apple review — which is what we want.
        # An EXTERNAL group would be listed here, and needs Beta App Review.
        #
        # submit_to_app_store intentionally omitted — TestFlight only.
