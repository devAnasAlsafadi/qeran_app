name: qeran
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6+8

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  responsive_framework: ^1.5.1
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  easy_localization: ^3.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_messaging: ^16.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.0
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  dartz: ^0.10.1
  flutter_svg: ^2.2.4
  flutter_animate: ^4.5.2
  country_picker: ^2.0.27
  image_picker: ^1.2.1
  http_parser: ^4.1.1
  cached_network_image: ^3.4.1
  signalr_netcore: ^1.4.4
  uuid: ^4.5.1
  purchases_flutter: ^10.3.0
  connectivity_plus: ^7.2.0
  intl: ^0.20.2
  share_plus: ^12.0.2
  lottie: ^3.3.3
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^0.3.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700

# Native (OS) splash — the warm-up surface the OS draws before the Flutter
# engine boots. Background is the #F8F8F8 canvas everywhere.
#
# Android 11- and iOS: the FULL Qeran logo (symbol + قِران QERAN), centred —
# matches what the Flutter/Dart splash displays (image = splash_logo.png).
#
# Android 12+: the OS constrains the splash to a circular icon window that
# crops wordmark text, so there we show the COMPLETE SYMBOL only — no bottom
# branding. splash_symbol.png is padded (700px monogram on a 1152 canvas)
# to sit inside the 768px safe circle without clipping.
#
# Assets in assets/images/ (splash_logo / splash_symbol) are generated from
# branding/src. Regenerate the OS resources after any change:
#   dart run flutter_native_splash:create   (undo: :remove)
flutter_native_splash:
  color: "#F8F8F8"
  color_dark: "#F8F8F8"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#F8F8F8"
    color_dark: "#F8F8F8"
    image: assets/images/splash_symbol.png
    image_dark: assets/images/splash_symbol.png
  android: true
  ios: true
